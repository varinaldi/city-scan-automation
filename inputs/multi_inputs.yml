# Multi-city input
# Usage: python -m tasks --all --multicities
# AOI subfolders go in inputs/AOI/{city_name}/
# Wards auto-detected from inputs/AOI/{city_name}_wards/ if exists

# Cities to process
# Each city can override any shared setting below
cities:
  - city_name: Windhoek
  - city_name: Swakopmund
  - city_name: Walvis Bay
  - city_name: Lüderitz
  - city_name: Aus


# optional: use the directory from a previous run by specifying the year and month in the format of yyyy-mm
# default value is null
prev_run_date:

# benchmark parameters (see docs/benchmarks.md)
benchmark_mode: auto
benchmark_backup:
nearby_countries:

# accessibility analysis parameters
osm_query:
  schools:
    amenity:
      - school
      - kindergarten
      - university
      - college
  health:
    amenity:
      - clinic
      - hospital
      - health
  police:
    amenity:
      - police
  fire:
    amenity:
      - fire_station
isochrone:  # unit: m
  schools:
    - 800
    - 1600
    - 2400
  health:
    - 1000
    - 2000
    - 3000
accessibility_buffer: 5  # percentage of AOI bounds to buffer in order to capture amenities and roads immediately outside the AOI

# flood analysis parameters
flood:
  threshold: 15  # unit: cm
  year:
    - 2020
    # - 2030
    # - 2050
    # - 2080
  ssp:  # available SSPs: 1, 2, 3, 5
    - 1
    - 2
    - 3
    # - 5
  return_period:  # available return periods: 10, 100, 1000, 20, 200, 5, 50, 500
    - 10
    - 100
    - 1000

# FWI date range
fwi_first_year: 2016
fwi_last_year: 2021

# land surface temperature parameters
# dataset available from 2013-03-18
first_year: 2015
last_year: 2026
