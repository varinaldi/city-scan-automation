[project]
name = "city-scan-automation"
version = "0.1.0"
description = "City Scan Automation — geospatial assessment pipeline"
requires-python = ">=3.9"

[project.scripts]
scan = "tasks.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tasks*", "core*"]
