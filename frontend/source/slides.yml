    title: "Population Growth & Density"
    layout: "Two Content"
  population_distribution_age_sex:
    title: "Population Distribution By Age & Sex"
    layout: "Title and Content"
  population:
    title: "Population Density"
    layout: "Content with Caption"
    Content 1: "maps/^pop_dens"
  rwi:
    title: "Relative Index Wealth"
    layout: "Content with Caption"
    Content 1: "maps/^relative_wealth"

# SECTION 4
economic_activity:
