# SECTION 1
executive_summary:
  section_title: "Executive Summary"
  intro:
    layout: "Section Header"
    Text: "Summarizes the key messages and top- line findings from each section of the City Scan, serving as an entry point for further discussion around investment identification and prioritization."
  slide1:
    title: "Executive Summary"
    layout: "Executive Summary 1"
  slide2:
    title: "Executive Summary"
    layout: "Executive Summary 2"

# SECTION 2
setting_the_context:
  section_title: "Setting Context"
  intro:
    layout: "Section Header"
    Text: "Descries the city's urbanization context, as well as its salient geographical features, principal economic activities, major access routes, and assets and constraints that favor or hinder urban expansion."
  basic_city_info:
    title: "Basic City Information"
    layout: "Content with Caption"
    Content 1: "maps/^aoi"
  infrastructure1:
    title: "State of Urban Infrastructure and Service Delivery"
    layout: "Title and Content"
  infrastructure2:
    title: "State of Urban Infrastructure and Service Delivery"
    layout: "Title and Content"

# SECTION 3
demographics:
  section_title: "Population and Demographics Trends"
  intro:
    layout: "Section Header"
    Text: "Presents some of the city's key population and demographic information, including growth trends, age distribution, and density."
